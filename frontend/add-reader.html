<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Add Reader</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Library Management System</h1>

    <h2>Add New Reader</h2>

    <form id="readerForm">

        <label>First Name</label>

        <input
            type="text"
            id="first_name"
            required
        >

        <label>Last Name</label>

        <input
            type="text"
            id="last_name"
        >

        <label>Email</label>

        <input
            type="email"
            id="email"
            required
        >

        <label>Phone</label>

        <input
            type="text"
            id="phone"
        >

        <label>Address</label>

        <input
            type="text"
            id="address"
        >

        <button type="submit">
            Add Reader
        </button>

    </form>

    <p id="readerMessage"></p>

    <a href="index.html">
        ← Back to Dashboard
    </a>

</div>

<script src="script.js"></script>

</body>

</html>
