<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="student.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>🎓 Student Login</h1>

            <p class="subtitle">
                Library Management System
            </p>

            <form id="studentLoginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

        </div>

    </div>

    <script src="student.js"></script>

</body>

</html>
