<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Books - Library Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Library Management System</h1>

        <h2>All Books</h2>

        <table id="booksTable">

            <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Title</th>
                    <th>ISBN</th>
                    <th>Edition</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Price</th>
                </tr>
            </thead>

            <tbody id="booksBody">
                <!-- Books will appear here -->
            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>

</html>
